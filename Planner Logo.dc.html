<x-dc>
<helmet>
  <style>
    @font-face { font-family: system; src: local(-apple-system); }
    body { margin: 0; background: #e8e5e0; }
  </style>
</helmet>
<div style="width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; background: #e8e5e0; font-family: -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; position: absolute; left: 2px; top: 5px">
  <div style="position:relative;width:400px;height:400px;border-radius:88px;overflow:visible;box-shadow:0 30px 60px rgba(0,0,0,0.35), 0 8px 16px rgba(0,0,0,0.25);">

    <!-- near page (sticks out a bit less, runs full height, same curvature as cover) -->
    <div style="position:absolute;left:200px;right:-24px;top:0;bottom:0;border-radius:88px;background:linear-gradient(90deg,#e2dabf 0%,#faf6ea 12%,#f0e7cd 55%,#d9d0b3 100%);box-shadow:inset -3px 0 5px rgba(0,0,0,0.18), 2px 0 3px rgba(0,0,0,0.12);z-index:2;"></div>

    <!-- far page (sticks out more, runs full height, same curvature as cover) -->
    <div style="position:absolute;left:210px;right:-38px;top:0;bottom:0;border-radius:88px;background:linear-gradient(90deg,#d6cba9 0%,#f4ecd8 12%,#e9deba 55%,#cfc19a 100%);box-shadow:inset -3px 0 5px rgba(0,0,0,0.2), 2px 0 3px rgba(0,0,0,0.15);z-index:1;"></div>

    <!-- back cover, thin dark strip peeking past the pages -->
    <div style="position:absolute;left:220px;right:-44px;top:2px;bottom:2px;border-radius:88px;background:linear-gradient(90deg,#151517 0%,#232326 60%,#0c0c0d 100%);z-index:0;"></div>

    <!-- planner cover -->
    <div style="position:absolute;inset:0;border-radius:88px;background:linear-gradient(155deg,#3a3a3d 0%,#161618 45%,#020203 100%);z-index:3;box-shadow:inset 0 2px 3px rgba(255,255,255,0.15), inset 0 -6px 14px rgba(0,0,0,0.6);">

      <!-- glossy sheen -->
      <div style="position:absolute;top:0;left:0;right:0;height:55%;border-radius:88px 88px 0 0;background:linear-gradient(180deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.05) 40%,rgba(255,255,255,0) 100%);z-index:4;pointer-events:none;"></div>

      <!-- dotted compass sigil -->
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;">
        <svg width="260" height="260" viewBox="0 0 260 260" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));">
          <defs>
            <linearGradient id="redMetal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4a0805"></stop>
              <stop offset="35%" stop-color="#d8210f"></stop>
              <stop offset="55%" stop-color="#ff8a6b"></stop>
              <stop offset="75%" stop-color="#c81f0f"></stop>
              <stop offset="100%" stop-color="#3a0502"></stop>
            </linearGradient>
            <linearGradient id="redMetalV" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#3a0502"></stop>
              <stop offset="45%" stop-color="#e2291b"></stop>
              <stop offset="55%" stop-color="#ff9478"></stop>
              <stop offset="70%" stop-color="#c81f0f"></stop>
              <stop offset="100%" stop-color="#4a0805"></stop>
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#redMetal)">
            <circle cx="130" cy="130" r="12" stroke-width="3" stroke-dasharray="1,4"></circle>
            <circle cx="130" cy="130" r="26" stroke-width="3" stroke-dasharray="1.5,5"></circle>
            <circle cx="130" cy="130" r="40" stroke-width="2.5" stroke-dasharray="2,6"></circle>
            <circle cx="130" cy="130" r="56" stroke-width="2.5" stroke-dasharray="3,7" opacity="0.85"></circle>
            <circle cx="130" cy="130" r="72" stroke-width="2" stroke-dasharray="1,9" opacity="0.55"></circle>

            <!-- taper barbs -->
            <line x1="112" y1="42" x2="148" y2="42" stroke-width="2.5"></line>
            <line x1="117" y1="55" x2="143" y2="55" stroke-width="2.5"></line>
            <line x1="108" y1="218" x2="152" y2="218" stroke-width="2.5"></line>
            <line x1="113" y1="205" x2="147" y2="205" stroke-width="2.5"></line>
            <line x1="42" y1="112" x2="42" y2="148" stroke-width="2.5"></line>
            <line x1="55" y1="117" x2="55" y2="143" stroke-width="2.5"></line>
            <line x1="218" y1="108" x2="218" y2="152" stroke-width="2.5"></line>
            <line x1="205" y1="113" x2="205" y2="147" stroke-width="2.5"></line>
          </g>
          <!-- cardinal blades, tapering into the rings like keyblade prongs -->
          <g fill="url(#redMetalV)">
            <polygon points="130,2 121,34 130,72 139,34"></polygon>
            <polygon points="130,258 121,226 130,188 139,226"></polygon>
          </g>
          <g fill="url(#redMetal)">
            <polygon points="2,130 34,121 72,130 34,139"></polygon>
            <polygon points="258,130 226,121 188,130 226,139"></polygon>
          </g>
          <circle cx="130" cy="130" r="6" fill="url(#redMetalV)"></circle>
          <circle cx="130" cy="130" r="6" fill="none" stroke="#6b0e07" stroke-width="1"></circle>

          <!-- small gem accents where blades meet the outer ring -->
          <g fill="url(#redMetalV)" stroke="#3a0502" stroke-width="0.75">
            <polygon points="130,64 125,72 130,80 135,72"></polygon>
            <polygon points="130,196 125,188 130,180 135,188"></polygon>
          </g>
          <g fill="url(#redMetal)" stroke="#3a0502" stroke-width="0.75">
            <polygon points="64,130 72,125 80,130 72,135"></polygon>
            <polygon points="196,130 188,125 180,130 188,135"></polygon>
          </g>

          <!-- notch details along the blade edges -->
          <g stroke="#3a0502" stroke-width="1" opacity="0.8">
            <line x1="124" y1="46" x2="130" y2="52"></line>
            <line x1="136" y1="46" x2="130" y2="52"></line>
            <line x1="124" y1="214" x2="130" y2="208"></line>
            <line x1="136" y1="214" x2="130" y2="208"></line>
            <line x1="46" y1="124" x2="52" y2="130"></line>
            <line x1="46" y1="136" x2="52" y2="130"></line>
            <line x1="214" y1="124" x2="208" y2="130"></line>
            <line x1="214" y1="136" x2="208" y2="130"></line>
          </g>

          <!-- faint outer filigree ring and diagonal accent dots -->
          <circle cx="130" cy="130" r="88" fill="none" stroke="url(#redMetal)" stroke-width="1" stroke-dasharray="0.5,10" opacity="0.4"></circle>
          <g fill="#8f1f12" opacity="0.75">
            <circle cx="66" cy="66" r="2.5"></circle>
            <circle cx="194" cy="66" r="2.5"></circle>
            <circle cx="66" cy="194" r="2.5"></circle>
            <circle cx="194" cy="194" r="2.5"></circle>
          </g>

          <!-- small diagonal mini-blades, echoing the cardinal prongs -->
          <g fill="url(#redMetal)" opacity="0.85">
            <polygon points="130,90 125,108 130,124 135,108" transform="rotate(45 130 130)"></polygon>
            <polygon points="130,90 125,108 130,124 135,108" transform="rotate(135 130 130)"></polygon>
            <polygon points="130,90 125,108 130,124 135,108" transform="rotate(225 130 130)"></polygon>
            <polygon points="130,90 125,108 130,124 135,108" transform="rotate(315 130 130)"></polygon>
          </g>

          <!-- diagonal dotted spokes linking outer dots to the ring -->
          <g stroke="#8f1f12" stroke-width="1.5" stroke-dasharray="1,4" opacity="0.6">
            <line x1="66" y1="66" x2="94" y2="94"></line>
            <line x1="194" y1="66" x2="166" y2="94"></line>
            <line x1="66" y1="194" x2="94" y2="166"></line>
            <line x1="194" y1="194" x2="166" y2="166"></line>
          </g>

          <!-- extra outer dashed rings for depth -->
          <circle cx="130" cy="130" r="100" fill="none" stroke="url(#redMetal)" stroke-width="1" stroke-dasharray="3,8" opacity="0.3"></circle>
          <circle cx="130" cy="130" r="112" fill="none" stroke="url(#redMetal)" stroke-width="0.75" stroke-dasharray="0.5,12" opacity="0.2"></circle>

          <!-- fine particle scatter between rings -->
          <g fill="#c81f0f" opacity="0.5">
            <circle cx="130" cy="96" r="1.2"></circle>
            <circle cx="130" cy="164" r="1.2"></circle>
            <circle cx="96" cy="130" r="1.2"></circle>
            <circle cx="164" cy="130" r="1.2"></circle>
            <circle cx="105" cy="105" r="1"></circle>
            <circle cx="155" cy="105" r="1"></circle>
            <circle cx="105" cy="155" r="1"></circle>
            <circle cx="155" cy="155" r="1"></circle>
          </g>
        </svg>
      </div>
    </div>

    <!-- spiral binder grommets along the left edge -->
